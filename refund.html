<!DOCTYPE html><html lang="id" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Refund — Aji Wira</title><meta name="description" content="Refund — Aji Wira — layanan digital Aji Wira."><link rel="stylesheet" href="css/style.css"><link rel="icon" href="/favicon.svg"><link rel="manifest" href="/manifest.json"></head><body>
<div class="bg-decor" aria-hidden="true"><div class="bg-grid"></div><div class="glow glow-green"></div></div>
<header class="navbar"><div class="navbar-inner container"><a href="index.html" class="brand"><span class="brand-mark">AW</span><span class="brand-text"><strong>Aji Wira</strong><small>Web Development Studio</small></span></a><nav class="nav-links"><a href="topup.html" class="nav-link">Digital Store</a><a href="order.html" class="nav-link">Cek Pesanan</a><a href="refund.html" class="nav-link active">Refund</a><a href="faq.html" class="nav-link">FAQ</a></nav></div></header>
<main class="store-page"><div class="container container-narrow"><div class="section-head"><span class="eyebrow">REFUND CENTER</span><h1>Ajukan <span class="text-accent">Refund</span></h1></div>
<div class="checkout-card" style="padding:24px"><form id="refundForm" class="store-form"><div class="field"><label for="refundOrder">Order ID</label><input id="refundOrder" required></div><div class="field"><label for="refundContact">Email / nomor kontak</label><input id="refundContact" required></div>
<div class="admin-actions"><button id="requestRefundOtp" class="btn btn-secondary" type="button">Kirim Kode OTP</button></div>
<div class="field" id="refundOtpWrap" hidden><label for="refundOtp">Kode OTP</label><input id="refundOtp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 digit kode"><small>Kode dikirim ke email yang terdaftar dan berlaku 10 menit.</small></div><div class="field"><label for="refundReason">Alasan</label><select id="refundReason" required><option value="">Pilih alasan</option><option>Pembayaran berhasil tetapi produk belum diterima</option><option>Transaksi gagal</option><option>Salah nominal</option><option>Masalah akun/game</option><option>Produk tidak sesuai</option><option>Transaksi ganda</option><option>Lainnya</option></select></div><div class="field"><label for="refundDescription">Deskripsi</label><textarea id="refundDescription" rows="5" maxlength="2000" required></textarea></div><button class="btn btn-primary" type="submit">Kirim Pengajuan</button><div id="turnstile-widget" style="margin-top:14px"></div></form><div id="refundResult" style="margin-top:18px"></div></div></div></main>
